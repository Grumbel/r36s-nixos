odroidgoa-uboot-config

# Loaded by the vendor (Hardkernel/ArkOS) U-Boot 2017.09 via `cfgload`
# from the first FAT partition. Hands off to the NixOS generated
# /extlinux/extlinux.conf so that generations and rollback work.
#
# Memory layout (1 GiB RAM, 0x08400000-0x0a200000 is reserved by OP-TEE):
#   0x00400000  extlinux.conf
#   0x01f00000  device tree
#   0x02000000  kernel Image (up to ~100 MiB)
#   0x0c000000  initrd (relocated to top of RAM by U-Boot)

setenv pxefile_addr_r "0x00400000"
setenv scriptaddr     "0x00400000"
setenv fdt_addr_r     "0x01f00000"
setenv kernel_addr_r  "0x02000000"
setenv ramdisk_addr_r "0x0c000000"

sysboot mmc 1:1 any ${pxefile_addr_r} /extlinux/extlinux.conf

echo "sysboot failed, resetting"
sleep 5
reset
