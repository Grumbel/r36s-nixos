# WiFi networks for the R36S (USB WiFi dongle on the OTG port).
#
# This file lives on the FAT boot partition, so it can be edited from
# any PC after flashing the image. Uncomment and fill in:
#
# Your country, otherwise only the channels allowed everywhere are used
# without restrictions (e.g. channels 12 and 13 only by passive scan).
#country=DE
#
#network={
#    ssid="MyNetwork"
#    psk="MyPassword"
#}
